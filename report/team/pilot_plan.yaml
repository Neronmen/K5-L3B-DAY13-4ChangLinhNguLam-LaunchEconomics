# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
# Số liệu lấy từ output `cd src && python lab13.py` (TV2 chạy lại trên máy riêng, ra ĐẠT; statsmodels đối chiếu 1.250 và power 0,64).
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0.70, 0.75) = 1.251 yêu cầu mỗi nhóm (statsmodels 1.250, lệch < 2%).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48 → n = 3.103 mỗi nhóm → 42 người mỗi nhóm, tổng 84 > 40: không đủ người.
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300 < 1.251, lại chỉ 6 cụm: loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (0,98 + 0,02m) ≥ 859 → m ≥ 299 yêu cầu mỗi người (DE 6,96).
#      Con số bất lợi: nếu tác động thật chỉ 5 điểm thì với n = 859 power chỉ còn 0,64 (không phải 0,80).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot (mỗi depot chia đôi).
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, mde 0,06, 3 luật dừng và ngày 2027-01-11 chốt trong file này trước ngày bắt đầu 2026-12-07.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (cụm) mỗi nhóm, tổng 40 = toàn bộ CSKH.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chia theo nhân viên 20 + 20 tách được tác động nhưng chỉ đủ mẫu cho mức chênh 6 điểm (cần ≥ 299 yêu cầu mỗi người),
#   không đủ cho 5 điểm (tối đa 1.000 < 1.251). Chấp nhận mde 0,06; nếu tác động thật là 5 điểm thì power 0,64,
#   tức khoảng 36% khả năng bỏ sót. Không chọn chia theo yêu cầu (đủ 1.251 nhưng tràn tác động cao) hay theo depot (tối đa 300, 6 cụm).
#   Ước lượng thời gian: phạm vi noi_dia + hang_nang ≈ 82% (982/1.200) của 1.500 yc/ngày ≈ 1.230 yc/ngày ≈ 31 yc/người/ngày
#   → cần khoảng 10 ngày làm việc ở bước 0.50 để mỗi người đạt 299 yêu cầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang 3,97% (39/982). Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu,
#   nên chọn: nhóm trợ lý cao hơn đối chứng ≥ 2 điểm, kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ loại noi_dia và hang_nang ở cả 12 depot (982/1.200 yêu cầu mẫu; cps 0,22× và 0,69× so với 12.000 đ, simulated); loại quoc_te (1,88×, thành công 27,3%, chạy lại không giúp) và doi_tac (0,85×, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 → 10 → 20 nhân viên dùng trợ lý; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 5 điểm cần 1.251/nhóm, 20 cụm chỉ cho tối đa 1.000
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96           # m = 299 yêu cầu mỗi nhân viên, ICC 0,02
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, cùng phạm vi noi_dia + hang_nang"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời của trợ lý; giảm bằng quyền truy cập theo tài khoản, log lượt mở trợ lý theo staff_id, loại khỏi phân tích nhân viên đối chứng có lượt mở"
    predeclared: "Có: chỉ số chính, mde 0,06, alpha 0,05, ba luật dừng, seed bốc thăm và ngày quyết định 2027-01-11 chốt trong file này trước ngày bắt đầu 2026-12-07"
  stop_rules:
    # an toàn
    - "NẾU mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng ≥ 2 điểm hoặc vượt 6%, hoặc có ≥ 1 ca hoàn tiền trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý bằng cờ tắt trong 30 phút và chuyển toàn bộ về luồng nhân viên tự làm KHÔNG THÌ không được sang bước rollout tiếp theo"
    # chi phí
    - "NẾU chi phí mỗi việc thành công (cộng chi phí cố định) > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở lại hang_nang"
    # mức độ sử dụng
    - "NẾU tỉ lệ nhân viên bỏ qua gợi ý > 40% hoặc tỉ lệ dùng < 20% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên nhóm trợ lý trong 3 ngày và báo PM trợ lý hoàn phí KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"   # hằng ngày theo luật dừng an toàn; không xem chỉ số chính trước ngày quyết định
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên CSKH tự xử lý như trước pilot; các ca đang dở do trợ lý soạn được nhân viên xem lại 100%"
  decision_date: "2027-01-11"     # bắt đầu 2026-12-07; 3 tuần rollout; khoảng 10 ngày làm việc ở bước 0.50 để đạt 299 yc/người
  simulated_inputs:
    - "phut_xem_lai_simulated, phut_lam_lai_simulated (xem lại 890 phút, làm lại 1.132 phút)"
    - "lương nhân viên dùng quy đổi phút xem lại, làm lại"
    - "chi phí mỗi việc thành công 4.472 đ (A2) và theo loại: noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ"
    - "chi phí cố định 40 triệu đ/tháng, 45.000 yc/tháng → 1.185 đ/việc; cps + cố định 4.599 đ = 0,38× (A4)"
    - "ngưỡng chi phí 8.000 đ trong luật dừng dựa trên cps simulated"
    - "baseline 0,70 và ICC 0,02 cho trước trong đề"
    - "tỉ lệ mở lại 7 ngày 4,25% (51/1.200), phạm vi 3,97% (39/982) đo trên dữ liệu mẫu giả lập"
